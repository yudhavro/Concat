format = 2

[effect]
id = "concat.stroke-run"
name = "Outline Drawing"
kind = "effect"
category = "Stylize"
version = 4
description = "Draws a shape's border round its outline once, across the clip's own length, ending with it."

# The two sliders keep their old keys so the host's shape-run wiring is
# untouched. `speed` is now the clip's length in seconds - the host fills it
# from the clip, so trimming the clip on the track sets how long the one pass
# takes. The wide range only guards against a clamp if it ever surfaces. `dash`
# is no longer read - it stays only so the uniform layout still lines up.
[[param]]
key = "dash"
label = "Hold"
min = 0
max = 1
default = 0.3
step = 0.01

[[param]]
key = "speed"
label = "Duration"
min = 0.05
max = 600
default = 1
step = 0.1

[wgsl]
entry = "effect.wgsl"
