format = 2

[effect]
id = "concat.stroke-run"
name = "Outline Drawing"
kind = "effect"
category = "Stylize"
version = 3
description = "Draws a shape's border round its outline once, over the duration, then removes it."

# The two sliders keep their old keys so the host's shape-run wiring is
# untouched. `speed` is the seconds one drawing pass takes (the duration); the
# outline is gone when it is reached. `dash` is no longer read - it stays only
# so the uniform layout still lines up.
[[param]]
key = "dash"
label = "Hold"
min = 0
max = 1
default = 0.3
step = 0.01

[[param]]
key = "speed"
label = "Duration"
min = 0.1
max = 8
default = 1
step = 0.1

[wgsl]
entry = "effect.wgsl"
